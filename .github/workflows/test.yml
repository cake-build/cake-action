name: Test
on: [push, pull_request]
jobs:
  test-with-script:
    name: Test with Cake Script
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      script-directory: integrationtests/script
      tools-directory: integrationtests/script/tools
    steps:
      - name: Get the sources
        uses: actions/checkout@v1
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run a specific Cake script
        uses: ./
        with:
          script-path: ${{ env.script-directory }}/build.cake
      - name: Run a specific target
        uses: ./
        with:
          script-path: ${{ env.script-directory }}/build.cake
          target: Successful-Task
      - name: Run with a specific Cake version
        env:
          EXPECTED_CAKE_VERSION: 2.1.0
        uses: ./
        with:
          cake-version: 2.1.0
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Cake-Version
      - name: Run with a different Cake version in the same build
        env:
          EXPECTED_CAKE_VERSION: 2.0.0
        uses: ./
        with:
          cake-version: 2.0.0
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Cake-Version
      - name: Run with a Cake version set by the tool manifest
        env:
          EXPECTED_CAKE_VERSION: 1.2.0
        uses: ./
        with:
          cake-version: tool-manifest
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Cake-Version
      - name: Get the latest Cake version from NuGet
        id: get-latest-cake-version
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const response = await fetch('https://azuresearch-usnc.nuget.org/query?q=packageid:Cake.Tool&prerelease=false&semVerLevel=2.0.0');
            if (!response.ok) {
              throw new Error(`NuGet responded with ${response.status}`);
            }
            const { data } = await response.json();
            return data[0].version;
      - name: Remove the installed Cake version
        run: rm -rf tools
        shell: bash
      - name: Run with the latest Cake version when no version is installed
        env:
          EXPECTED_CAKE_VERSION: ${{ steps.get-latest-cake-version.outputs.result }}
        uses: ./
        with:
          cake-version: latest
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Cake-Version
      - name: Install an older Cake version
        uses: ./
        with:
          cake-version: 2.0.0
          script-path: ${{ env.script-directory }}/build.cake
          target: Successful-Task
      - name: Run with the latest Cake version when an older version is installed
        env:
          EXPECTED_CAKE_VERSION: ${{ steps.get-latest-cake-version.outputs.result }}
        uses: ./
        with:
          cake-version: latest
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Cake-Version
      - name: Install a newer Cake version than the package source offers
        uses: ./
        with:
          cake-version: 2.1.0
          script-path: ${{ env.script-directory }}/build.cake
          target: Successful-Task
      - name: Add a package source whose latest Cake version is 2.0.0
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const response = await fetch('https://api.nuget.org/v3-flatcontainer/cake.tool/2.0.0/cake.tool.2.0.0.nupkg');
            if (!response.ok) {
              throw new Error(`NuGet responded with ${response.status}`);
            }
            fs.mkdirSync('local-feed');
            fs.writeFileSync('local-feed/cake.tool.2.0.0.nupkg', Buffer.from(await response.arrayBuffer()));
            fs.writeFileSync('nuget.config', `<?xml version="1.0" encoding="utf-8"?>
            <configuration>
              <packageSources>
                <clear />
                <add key="local-feed" value="local-feed" />
              </packageSources>
            </configuration>
            `);
      - name: Run with the latest Cake version when a newer version is installed
        env:
          EXPECTED_CAKE_VERSION: 2.0.0
        uses: ./
        with:
          cake-version: latest
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Cake-Version
      - name: Remove the package source
        run: rm -rf nuget.config local-feed
        shell: bash
      - name: Run automatic bootstrapping of Cake modules (Cake >= 1.0.0)
        uses: ./
        with:
          cake-bootstrap: auto
          cake-version: 1.0.0
          script-path: ${{ env.script-directory }}/module.cake
      - name: Remove the tools directory
        run: rm -rf ${{ env.tools-directory }}
        shell: bash
      - name: Run automatic bootstrapping of Cake modules (Cake < 1.0.0)
        uses: ./
        with:
          cake-bootstrap: auto
          cake-version: 0.38.5
          script-path: ${{ env.script-directory }}/build.cake
          target: Successful-Task
      - name: Remove the tools directory
        run: rm -rf ${{ env.tools-directory }}
        shell: bash
      - name: Run explicit bootstrapping of Cake modules (Cake >= 1.0.0)
        uses: ./
        with:
          cake-bootstrap: explicit
          cake-version: 1.0.0
          script-path: ${{ env.script-directory }}/module.cake
      - name: Remove the tools directory
        run: rm -rf ${{ env.tools-directory }}
        shell: bash
      - name: Run explicit bootstrapping of Cake modules (Cake < 1.0.0)
        uses: ./
        with:
          cake-bootstrap: explicit
          cake-version: 0.38.5
          script-path: ${{ env.script-directory }}/module.cake
      - name: Remove the tools directory
        run: rm -rf ${{ env.tools-directory }}
        shell: bash
      - name: Run skip bootstrapping of Cake modules (Cake >= 1.0.0)
        uses: ./
        with:
          cake-bootstrap: skip
          cake-version: 1.0.0
          script-path: ${{ env.script-directory }}/build.cake
          target: Successful-Task
      - name: Run skip bootstrapping of Cake modules (Cake < 1.0.0)
        uses: ./
        with:
          cake-bootstrap: skip
          cake-version: 0.38.5
          script-path: ${{ env.script-directory }}/build.cake
          target: Successful-Task
      - name: Run with a specific verbosity level
        uses: ./
        env:
          EXPECTED_VERBOSITY: Diagnostic
        with:
          verbosity: Diagnostic
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Verbosity
      - name: Do a dry run
        uses: ./
        with:
          dry-run: true
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Dry-Run
      - name: Run with custom script parameters
        uses: ./
        env:
          EXPECTED_STRING_ARGUMENT: '''value'''
          EXPECTED_NUMERIC_ARGUMENT: '3'
          EXPECTED_BOOLEAN_ARGUMENT: 'true'
        with:
          script-path: ${{ env.script-directory }}/build.cake
          target: Test-Script-Parameters
          arguments: |
            string-parameter: 'value'
            numeric-parameter: 3
            boolean-parameter: true
  test-with-frosting:
    name: Test with Cake Frosting
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      project-directory: integrationtests/frosting
    steps:
      - name: Get the sources
        uses: actions/checkout@v1
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run a specific Cake Frosting project
        uses: ./
        with:
          project-path: ${{ env.project-directory}}/Build.csproj
      - name: Run a specific target
        uses: ./
        with:
          project-path: ${{ env.project-directory}}/Build.csproj
          target: Successful-Task
      - name: Run with a specific verbosity level
        uses: ./
        env:
          EXPECTED_VERBOSITY: Diagnostic
        with:
          verbosity: Diagnostic
          project-path: ${{ env.project-directory}}/Build.csproj
          target: Test-Verbosity
      - name: Do a dry run
        uses: ./
        with:
          dry-run: true
          project-path: ${{ env.project-directory }}/Build.csproj
          target: Test-Dry-Run
      - name: Run with custom script parameters
        uses: ./
        env:
          EXPECTED_STRING_ARGUMENT: '''value'''
          EXPECTED_NUMERIC_ARGUMENT: '3'
          EXPECTED_BOOLEAN_ARGUMENT: 'true'
        with:
          project-path: ${{ env.project-directory }}/Build.csproj
          target: Test-Script-Parameters
          arguments: |
            string-parameter: 'value'
            numeric-parameter: 3
            boolean-parameter: true
  test-with-file:
    name: Test with Cake C# File
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      file-directory: integrationtests/file
    steps:
      - name: Get the sources
        uses: actions/checkout@v1
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the .NET 10 SDK (Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run a specific Cake C# file
        uses: ./
        with:
          file-path: ${{ env.file-directory }}/Build.cs
      - name: Run a specific target
        uses: ./
        with:
          file-path: ${{ env.file-directory }}/Build.cs
          target: Successful-Task
      - name: Run with a specific verbosity level
        uses: ./
        env:
          EXPECTED_VERBOSITY: Diagnostic
        with:
          verbosity: Diagnostic
          file-path: ${{ env.file-directory }}/Build.cs
          target: Test-Verbosity
      - name: Do a dry run
        uses: ./
        with:
          dry-run: true
          file-path: ${{ env.file-directory }}/Build.cs
          target: Test-Dry-Run
      - name: Run with custom script parameters
        uses: ./
        env:
          EXPECTED_STRING_ARGUMENT: '''value'''
          EXPECTED_NUMERIC_ARGUMENT: '3'
          EXPECTED_BOOLEAN_ARGUMENT: 'true'
        with:
          file-path: ${{ env.file-directory }}/Build.cs
          target: Test-Script-Parameters
          arguments: |
            string-parameter: 'value'
            numeric-parameter: 3
            boolean-parameter: true
